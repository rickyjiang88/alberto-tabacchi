name: Build Alberto Fidelity iOS icon
on:
  push:
    paths:
      - '.github/workflows/build-fidelity-icon.yml'
      - 'alberto-fidelity-icon.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render iOS PNG icon
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='alberto-fidelity-icon.svg',write_to='alberto-fidelity-icon.png',output_width=512,output_height=512)
          PY
      - name: Publish PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alberto-fidelity-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish Alberto Fidelity iPhone PNG icon"
            git push
          fi
