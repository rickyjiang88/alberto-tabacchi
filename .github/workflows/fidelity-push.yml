name: Alberto Fidelity push sender

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: alberto-fidelity-push
  cancel-in-progress: false

jobs:
  send:
    if: ${{ vars.ENABLE_FIDELITY_PUSH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'firebase-admin>=6.5,<8'
      - name: Deliver pending push notifications
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/send_fidelity_push.py
