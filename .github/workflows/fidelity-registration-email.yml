name: Alberto Fidelity - nuove registrazioni email

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fidelity-registration-email.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: alberto-fidelity-registration-emails
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registration notification script
        run: python -m py_compile scripts/send_fidelity_registration_emails.py
      - name: Install Firebase Admin
        run: python -m pip install 'firebase-admin>=6.5,<8'
      - name: Verify Resend email sending with a single test
        if: github.event_name == 'push'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          key = os.environ.get('RESEND_API_KEY','').strip()
          if not key:
              raise SystemExit('RESEND_API_KEY secret missing: check the exact name in GitHub settings')
          payload = {
              'from':'Alberto Fidelity <info@albertotabacchi.com>',
              'to':['info@albertotabacchi.com'],
              'subject':'TEST - Alberto Fidelity: email registrazioni attivata',
              'text':'Questa è una sola email di verifica tecnica, non una registrazione reale. Il sistema avviserà automaticamente alla registrazione di nuovi clienti.'
          }
          req = Request('https://api.resend.com/emails',
              data=json.dumps(payload).encode('utf-8'),
              headers={'Authorization':'Bearer '+key, 'Content-Type':'application/json',
                  'Idempotency-Key':'alberto-fidelity-email-setup-check-20261013'},
              method='POST')
          with urlopen(req, timeout=25) as response:
              data = json.loads(response.read().decode('utf-8'))
          if not data.get('id'):
              raise SystemExit('Resend did not return an email ID')
          print('Verification message accepted by Resend')
          PY
      - name: Send one owner email per new registration
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_fidelity_registration_emails.py
