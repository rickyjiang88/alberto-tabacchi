name: Alberto Fidelity - nuove registrazioni email

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: alberto-fidelity-registration-emails
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registration notification script
        run: python -m py_compile scripts/send_fidelity_registration_emails.py
      - name: Install Firebase Admin
        run: python -m pip install 'firebase-admin>=6.5,<8'
      - name: Send one owner email per new registration
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_fidelity_registration_emails.py
