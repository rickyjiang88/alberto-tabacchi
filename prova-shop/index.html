<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alberto · Ordina e ritira</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f4ef;color:#181818}.demo{background:#fff0bd;padding:8px;text-align:center;font-size:12px;font-weight:800}.top{background:#b5101b;color:#fff;padding:7px 5%;display:flex;gap:28px;font-size:12px}header{background:white;padding:12px 5%;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:10}.logo{height:56px}.hero{padding:52px 5%;background:linear-gradient(115deg,#8f0b13,#cf1823);color:white}.hero h1{font-size:clamp(40px,7vw,78px);margin:0}.cats{display:flex;gap:8px;overflow:auto;padding:16px 5%;background:white;position:sticky;top:80px;z-index:8}.cats button{border:1px solid #ddd;background:white;padding:11px 15px;border-radius:22px;font-weight:800;white-space:nowrap}.cats button.active{background:#b5101b;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}main{padding:28px 5% 110px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 22px #0001;display:flex;flex-direction:column;min-height:205px}.desc{color:#555;flex:1}.bottom{display:flex;align-items:center;margin-top:15px}.price{font-size:21px;font-weight:900}.add,.checkout,.confirm{border:0;background:#b5101b;color:#fff;border-radius:10px;padding:11px 14px;font-weight:900}.add{margin-left:auto}.cartbar{position:fixed;left:5%;right:5%;bottom:12px;background:#191919;color:white;border-radius:15px;padding:13px 17px;display:flex;justify-content:space-between;z-index:12}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:30;align-items:flex-start;justify-content:center;padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch}.modal .box{margin:auto 0;max-height:calc(100dvh - 30px);overflow-y:auto;-webkit-overflow-scrolling:touch}.modal.on{display:flex}.box{background:white;border-radius:18px;padding:22px;width:min(500px,100%)}.box input,.box select,.box textarea{width:100%;padding:12px;margin:5px 0 11px}.daytag{font-size:11px;font-weight:900;color:#b5101b}.compose{background:#fff;border-radius:18px;padding:20px;margin:12px 0 26px;box-shadow:0 5px 22px #0001}.compose h3{margin:18px 0 8px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{border:1px solid #ddd;background:#fff;border-radius:10px;padding:11px;text-align:left;font-weight:700}.choice.sel{border:2px solid #b5101b;background:#fff4f4}.composeTotal{font-size:25px;font-weight:900;margin:18px 0 10px}.composeAdd{width:100%;border:0;background:#b5101b;color:#fff;border-radius:10px;padding:14px;font-weight:900}.lunchAdded{background:#f7f4ef;border-radius:12px;padding:12px;margin:12px 0;font-weight:800}.anotherLunch{width:100%;border:2px solid #b5101b;background:white;color:#b5101b;border-radius:10px;padding:12px;font-weight:900;margin-top:10px}@media(max-width:800px){.top{display:none}.grid{grid-template-columns:1fr 1fr}.hero{padding:42px 5%}}</style></head><body><div class="demo">AREA DI PROVA · NON COLLEGATA AL MENU PUBBLICO</div><div class="top"><span>Via Valtorta 44, Milano</span><span>02 289 6720</span><span>Lun–Sab 6:00–19:00</span></div><header><img class="logo" src="https://primary.jwwb.nl/public/k/m/t/temp-uuviykehkzslooegqmdl/image-high-zhh1za.png?enable=upscale&enable-io=true&height=70"></header><section class="hero"><h1>MANGI? O STAI A GUARDARE?</h1><p>Ordina il tuo pranzo. Passa da Alberto e ritira.</p></section><div class="cats" id="cats"></div><main><div id="menu"></div></main><div class="cartbar"><div><b><span id="count">0</span> prodotti</b><br><span id="total">€ 0,00</span></div><button class="checkout" onclick="openCart()">VEDI CARRELLO →</button></div><div class="modal" id="upsellModal"><div class="box"><div id="upsellStep"></div><button class="confirm" id="upsellYes">+ AGGIUNGI</button><button class="confirm" style="background:#eee;color:#222;margin-top:8px" id="upsellNo">NO GRAZIE</button></div></div><div class="modal" id="modal"><div class="box"><h2>Il tuo ordine</h2><div id="summary"></div><select id="pickup"><option>12:00</option><option>12:15</option><option>12:30</option><option>12:45</option><option>13:00</option><option>13:15</option><option>13:30</option><option>13:45</option><option>14:00</option></select><input id="customerName" autocomplete="name" placeholder="Nome e cognome"><input id="customerPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Telefono"><textarea id="notes" placeholder="Note"></textarea><button class="confirm" onclick="sendOrder()">CONFERMA ORDINE · PAGA AL RITIRO</button></div></div><script>
const fixed=[["Lo Chef Consiglia","Beata Burrata","Pastrami di manzo con carciofi e burrata",13],["Lo Chef Consiglia","Pokè Classico","Riso basmati, cipolla crunch, avocado, pomodorini, salmone affumicato",12],["Lo Chef Consiglia","Salmon Salad","Insalata, salmone affumicato, avocado, pomodorini, arancia, semi di sesamo",12],["Panini","Il Classico","Prosciutto cotto, fontina",6],["Panini","Crudo al Cuore","Prosciutto crudo, mozzarella",6],["Panini","Ti Speck-o il Cuore","Speck, brie",6],["Panini","Al Sud di Bologna","Mortadella, provola affumicata, pomodori secchi",6],["Panini","Brie Sotto Rosa","Prosciutto cotto, brie, salsa rosa",6],["Panini","Tacchino & Co","Arrosto di tacchino, insalata, pomodoro, mayo",6],["Panini","Il Milanese","Cotoletta di pollo, pomodoro, insalata, maionese",6],["Panini","La Finta Dieta","Verdure grigliate, mozzarella o brie",6],["Panini","Cala-Brie","Salame piccante, brie, pomodori secchi",6],["Panini","L’Eroe Salsiccia","Salsiccia, scamorza affumicata, peperoni",7],["Piadine","Il Gemello","Prosciutto cotto, fontina",7],["Piadine","Il Crudissimo","Prosciutto crudo, mozzarella",7],["Piadine","La Valtellina","Bresaola, rucola, scaglie di grana",8],["Toast","Prosciutto cotto, fontina","",4.5]];
const defaultDaily=[["Primi piatti","Primo 1","",10,true],["Primi piatti","Primo 2","",10,true],["Primi piatti","Primo 3","",10,true],["Primi piatti","Primo 4","",10,true],["Primi piatti","Primo 5","",10,true],["Secondi piatti","Secondo 1","",10,true],["Secondi piatti","Secondo 2","",10,true],["Secondi piatti","Secondo 3","",10,true],["Secondi piatti","Secondo 4","",10,true],["Contorno","Contorno 1","",10,true],["Contorno","Contorno 2","",10,true],["Contorno","Contorno 3","",10,true],["Piatto unico","Piatto unico","",11,true]];
const daily=JSON.parse(localStorage.getItem("albertoDailyV2")||JSON.stringify(defaultDaily)).filter(x=>x[4]).map(x=>["Piatti del Giorno",x[1],x[2],Number(x[3])]);
const P=[...daily,...fixed],cats=[...new Set(P.map(x=>x[0]))];let cart=[],lunchBoxCount=0;const euro=n=>"€ "+Number(n).toFixed(2).replace(".",",");
catsEl=document.getElementById("cats");catsEl.innerHTML=cats.map((c,i)=>`<button class="${i?"":"active"}" onclick="go(${i},this)">${c.toUpperCase()}</button>`).join("");function go(i,b){document.querySelectorAll(".cats button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("s"+i).scrollIntoView({behavior:"smooth"})}
function card(p,i,tag){return `<article class="card">${tag?'<span class="daytag">'+tag+'</span>':""}<h3>${p[1]}</h3><div class="desc">${p[2]}</div><div class="bottom"><span class="price">${euro(p[3])}</span><button class="add" onclick="add(${i})">+ AGGIUNGI</button></div></article>`}
let meal={primo:null,secondo:null,contorno:null};
function mealPrice(){const p=meal.primo!==null,s=meal.secondo!==null,c=meal.contorno!==null;if(p&&s)return 13;if(s)return 10;if(p&&c)return 10;if(p)return 8;if(c)return 4;return 0}
function chooseMeal(type,i){meal[type]=meal[type]===i?null:i;drawComposer()}
function drawComposer(){const el=document.getElementById("composer");if(!el)return;const groups={primo:daily.slice(0,5),secondo:daily.slice(5,9),contorno:daily.slice(9,12)};let h='<div class="compose"><h2>COMPONI IL TUO PRANZO</h2><p>Scegli quello che vuoi. Il prezzo viene calcolato automaticamente.</p>';[['primo','PRIMO'],['secondo','SECONDO'],['contorno','CONTORNO']].forEach(g=>{h+='<h3>'+g[1]+'</h3><div class="choices">'+groups[g[0]].map((p,j)=>{const idx=(g[0]==='primo'?j:g[0]==='secondo'?j+5:j+9);return '<button class="choice '+(meal[g[0]]===idx?'sel':'')+'" onclick="chooseMeal(\''+g[0]+'\','+idx+')">'+p[1]+'</button>'}).join('')+'</div>'});h+='<div class="composeTotal">Totale: '+euro(mealPrice())+'</div><small>Secondo: €10 con contorno incluso. Se non scegli il contorno, il prezzo resta €10.</small><button class="composeAdd" onclick="addMeal()">AGGIUNGI IL PRANZO AL CARRELLO</button></div>';el.innerHTML=h}
function addMeal(){const price=mealPrice();if(!price)return alert("Scegli almeno un piatto.");lunchBoxCount++;const names=[meal.primo,meal.secondo,meal.contorno].filter(x=>x!==null).map(i=>daily[i][1]);cart.push(["Lunch Box","LUNCH BOX "+lunchBoxCount,names.join(" + "),price]);update();meal={primo:null,secondo:null,contorno:null};drawComposer();const el=document.getElementById("composer");if(el){el.insertAdjacentHTML("afterbegin",`<div class="lunchAdded">LUNCH BOX ${lunchBoxCount} aggiunta al carrello · ${euro(price)}<br><small>${names.join(" + ")}</small><button class="anotherLunch" onclick="document.querySelector(\'.compose\').scrollIntoView({behavior:\'smooth\'})">+ COMPONI UN\'ALTRA LUNCH BOX</button></div>`)}q=JSON.parse(localStorage.getItem("albertoUpsells")||JSON.stringify(DEF)).filter(x=>x.active&&x.trigger==="ALL");pos=0;q.length?show():void 0}
menu.innerHTML=cats.map((c,ci)=>{if(c==="Piatti del Giorno")return `<section id="s${ci}"><div id="composer"></div></section>`;return `<section id="s${ci}"><h2>${c}</h2><div class="grid">`+P.map((p,i)=>p[0]===c?card(p,i,""):"").join("")+`</div></section>`}).join("");drawComposer();
const DEF=[{trigger:"Panini",title:"CI AGGIUNGI QUALCOSA? 🍟",text:"Vuoi un contorno di patatine fritte?",name:"Patatine fritte",price:3,active:true},{trigger:"ALL",title:"COSA VUOI BERE? 🥤",text:"Aggiungi una bevanda",name:"Bevanda",price:2.5,active:true},{trigger:"ALL",title:"UN DOLCE? 🍰",text:"Aggiungi il dolce del giorno",name:"Dolce del giorno",price:3,active:true}];let q=[],pos=0;function add(i){cart.push(P[i]);update();q=JSON.parse(localStorage.getItem("albertoUpsells")||JSON.stringify(DEF)).filter(x=>x.active&&(x.trigger==="ALL"||x.trigger===P[i][0]));pos=0;q.length?show():void 0}function show(){let u=q[pos];if(!u){upsellModal.classList.remove("on");return}upsellStep.innerHTML=`<h2>${u.title}</h2><p>${u.text}</p><b>${u.name} · ${euro(u.price)}</b>`;upsellYes.textContent="+ AGGIUNGI · "+euro(u.price);upsellModal.classList.add("on")}upsellYes.onclick=()=>{let u=q[pos];cart.push(["Upselling",u.name,u.text,+u.price]);update();pos++;show()};upsellNo.onclick=()=>{pos++;show()};function update(){count.textContent=cart.length;total.textContent=euro(cart.reduce((s,p)=>s+p[3],0))}function openCart(){if(!cart.length)return;summary.innerHTML=cart.map(p=>"<p><b>"+p[1]+"</b><br><small>"+(p[2]||"")+"</small><br><b>"+euro(p[3])+"</b></p>").join("");modal.classList.add("on")}function sendOrder(){const customerName=document.getElementById("customerName").value.trim(),customerPhone=document.getElementById("customerPhone").value.trim(),pickupTime=document.getElementById("pickup").value,orderNotes=document.getElementById("notes").value.trim();if(!customerName||!customerPhone)return alert("Inserisci nome e telefono");let os=JSON.parse(localStorage.getItem("albertoOrders")||"[]");os.unshift({id:Date.now(),name:customerName,phone:customerPhone,time:pickupTime,notes:orderNotes,items:cart,total:cart.reduce((s,p)=>s+p[3],0),status:"NUOVO"});localStorage.setItem("albertoOrders",JSON.stringify(os));alert("ORDINE CONFERMATO");cart=[];lunchBoxCount=0;update();document.getElementById("modal").classList.remove("on")}
</script></body></html>
