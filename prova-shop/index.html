<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alberto • Prova Shop Pranzo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f4ef;color:#191919}.top{background:#b50d18;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:4}.brand{font-size:28px;font-weight:900}.tag{font-size:11px;letter-spacing:1px}.cart{background:#fff;color:#b50d18;padding:11px 16px;border-radius:30px;font-weight:800}.hero{padding:55px 5%;background:linear-gradient(120deg,#1d1d1d,#4b1719);color:#fff}.hero h1{font-size:clamp(38px,7vw,76px);margin:0;max-width:800px}.hero p{font-size:19px}.cats{display:flex;gap:8px;overflow:auto;padding:16px 5%;background:#fff;position:sticky;top:72px;z-index:3}.cats button,.add,.checkout{border:0;border-radius:24px;padding:11px 16px;font-weight:800}.cats button:first-child,.add,.checkout{background:#c5131f;color:white}.wrap{padding:20px 5% 100px}.section{display:flex;justify-content:space-between;align-items:end}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 5px 24px #00000010}.pic{height:150px;background:linear-gradient(135deg,#e7d7bf,#bd8b55);display:grid;place-items:center;font-size:54px}.info{padding:17px}.info h3{margin:0 0 8px}.price{font-size:22px;font-weight:900;margin:14px 0}.add{width:100%}.bar{position:fixed;bottom:12px;left:5%;right:5%;background:#191919;color:#fff;padding:14px 18px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 35px #0005}.checkout{font-size:15px}.demo{background:#fff3cd;color:#704d00;padding:10px;text-align:center;font-weight:700;font-size:13px}@media(max-width:600px){.hero{padding-top:38px}.grid{grid-template-columns:1fr 1fr}.pic{height:120px}.info{padding:12px}.brand{font-size:23px}}
</style></head><body><div class="demo">VERSIONE DI PROVA • non collegata al sito pubblico</div><div class="top"><div><div class="brand">ALBERTO</div><div class="tag">TABACCHI BAR CON CUCINA</div></div><div class="cart">🛒 <span id="count">0</span></div></div><section class="hero"><h1>MANGI? O STAI A GUARDARE?</h1><p>Ordina adesso. Passa da Alberto. Il tuo pranzo è pronto.</p></section><div class="cats"><button>MENU DEL GIORNO</button><button>PANINI</button><button>PIADINE</button><button>INSALATONE</button><button>BEVANDE</button></div><main class="wrap"><div class="section"><div><small>OGGI DA ALBERTO</small><h2>Menu del giorno</h2></div></div><div class="grid" id="grid"></div></main><div class="bar"><div><b><span id="items">0</span> prodotti</b><br><span id="total">€ 0,00</span></div><button class="checkout" onclick="checkout()">VEDI CARRELLO →</button></div><script>
const products=[['Riso alla cantonese','Riso, uova, piselli e prosciutto',8,'🍚'],['Pollo alle mandorle','Pollo saltato e mandorle',10,'🍗'],['Beata Burrata','Pastrami, carciofi, burrata 125g',10,'🥪'],['Insalatona','Fresca e preparata al momento',9,'🥗']];let cart=[];const euro=n=>'€ '+n.toFixed(2).replace('.',',');function render(){grid.innerHTML=products.map((p,i)=>'<article class="card"><div class="pic">'+p[3]+'</div><div class="info"><h3>'+p[0]+'</h3><div>'+p[1]+'</div><div class="price">'+euro(p[2])+'</div><button class="add" onclick="add('+i+')">+ AGGIUNGI</button></div></article>').join('')}function add(i){cart.push(products[i]);update()}function update(){count.textContent=items.textContent=cart.length;total.textContent=euro(cart.reduce((s,p)=>s+p[2],0))}function checkout(){if(!cart.length)return alert('Aggiungi almeno un prodotto.');alert('PROVA CARRELLO\n\n'+cart.map(p=>'1× '+p[0]).join('\n')+'\n\nTotale: '+euro(cart.reduce((s,p)=>s+p[2],0))+'\n\nNella versione completa qui scegli orario, inserisci nome e telefono e confermi l’ordine.')}render();
</script></body></html>
