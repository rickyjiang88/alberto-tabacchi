<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alberto · Ordina e ritira</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f4ef;color:#181818}.demo{background:#fff0bd;padding:8px;text-align:center;font-size:12px;font-weight:800}.top{background:#b5101b;color:#fff;padding:7px 5%;display:flex;gap:28px;font-size:12px}header{background:white;padding:12px 5%;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:10}.logo{height:56px}.hero{padding:52px 5%;background:linear-gradient(115deg,#8f0b13,#cf1823);color:white}.hero h1{font-size:clamp(40px,7vw,78px);margin:0}.cats{display:flex;gap:8px;overflow:auto;padding:16px 5%;background:white;position:sticky;top:80px;z-index:8}.cats button{border:1px solid #ddd;background:white;padding:11px 15px;border-radius:22px;font-weight:800;white-space:nowrap}.cats button.active{background:#b5101b;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}main{padding:28px 5% 110px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 22px #0001;display:flex;flex-direction:column;min-height:205px}.desc{color:#555;flex:1}.bottom{display:flex;align-items:center;margin-top:15px}.price{font-size:21px;font-weight:900}.add,.checkout,.confirm{border:0;background:#b5101b;color:#fff;border-radius:10px;padding:11px 14px;font-weight:900}.add{margin-left:auto}.cartbar{position:fixed;left:5%;right:5%;bottom:12px;background:#191919;color:white;border-radius:15px;padding:13px 17px;display:flex;justify-content:space-between;z-index:12}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:30;align-items:center;justify-content:center;padding:15px}.modal.on{display:flex}.box{background:white;border-radius:18px;padding:22px;width:min(500px,100%)}.box input,.box select,.box textarea{width:100%;padding:12px;margin:5px 0 11px}.daytag{font-size:11px;font-weight:900;color:#b5101b}@media(max-width:800px){.top{display:none}.grid{grid-template-columns:1fr 1fr}.hero{padding:42px 5%}}</style></head><body><div class="demo">AREA DI PROVA · NON COLLEGATA AL MENU PUBBLICO</div><div class="top"><span>Via Valtorta 44, Milano</span><span>02 289 6720</span><span>Lun–Sab 6:00–19:00</span></div><header><img class="logo" src="https://primary.jwwb.nl/public/k/m/t/temp-uuviykehkzslooegqmdl/image-high-zhh1za.png?enable=upscale&enable-io=true&height=70"></header><section class="hero"><h1>MANGI? O STAI A GUARDARE?</h1><p>Ordina il tuo pranzo. Passa da Alberto e ritira.</p></section><div class="cats" id="cats"></div><main><div id="menu"></div></main><div class="cartbar"><div><b><span id="count">0</span> prodotti</b><br><span id="total">€ 0,00</span></div><button class="checkout" onclick="openCart()">VEDI CARRELLO →</button></div><div class="modal" id="upsellModal"><div class="box"><div id="upsellStep"></div><button class="confirm" id="upsellYes">+ AGGIUNGI</button><button class="confirm" style="background:#eee;color:#222;margin-top:8px" id="upsellNo">NO GRAZIE</button></div></div><div class="modal" id="modal"><div class="box"><h2>Il tuo ordine</h2><div id="summary"></div><select id="pickup"><option>12:00</option><option>12:15</option><option>12:30</option><option>12:45</option><option>13:00</option><option>13:15</option><option>13:30</option><option>13:45</option><option>14:00</option></select><input id="name" placeholder="Nome e cognome"><input id="phone" placeholder="Telefono"><textarea id="notes" placeholder="Note"></textarea><button class="confirm" onclick="sendOrder()">CONFERMA ORDINE · PAGA AL RITIRO</button></div></div><script>
const fixed=[["Lo Chef Consiglia","Beata Burrata","Pastrami di manzo con carciofi e burrata",13],["Lo Chef Consiglia","Pokè Classico","Riso basmati, cipolla crunch, avocado, pomodorini, salmone affumicato",12],["Lo Chef Consiglia","Salmon Salad","Insalata, salmone affumicato, avocado, pomodorini, arancia, semi di sesamo",12],["Panini","Il Classico","Prosciutto cotto, fontina",6],["Panini","Crudo al Cuore","Prosciutto crudo, mozzarella",6],["Panini","Ti Speck-o il Cuore","Speck, brie",6],["Panini","Al Sud di Bologna","Mortadella, provola affumicata, pomodori secchi",6],["Panini","Brie Sotto Rosa","Prosciutto cotto, brie, salsa rosa",6],["Panini","Tacchino & Co","Arrosto di tacchino, insalata, pomodoro, mayo",6],["Panini","Il Milanese","Cotoletta di pollo, pomodoro, insalata, maionese",6],["Panini","La Finta Dieta","Verdure grigliate, mozzarella o brie",6],["Panini","Cala-Brie","Salame piccante, brie, pomodori secchi",6],["Panini","L’Eroe Salsiccia","Salsiccia, scamorza affumicata, peperoni",7],["Piadine","Il Gemello","Prosciutto cotto, fontina",7],["Piadine","Il Crudissimo","Prosciutto crudo, mozzarella",7],["Piadine","La Valtellina","Bresaola, rucola, scaglie di grana",8],["Toast","Prosciutto cotto, fontina","",4.5]];
const defaultDaily=[["Primi piatti","Primo 1","",10,true],["Primi piatti","Primo 2","",10,true],["Primi piatti","Primo 3","",10,true],["Primi piatti","Primo 4","",10,true],["Primi piatti","Primo 5","",10,true],["Secondi piatti","Secondo 1","",10,true],["Secondi piatti","Secondo 2","",10,true],["Secondi piatti","Secondo 3","",10,true],["Secondi piatti","Secondo 4","",10,true],["Contorno","Contorno 1","",10,true],["Contorno","Contorno 2","",10,true],["Contorno","Contorno 3","",10,true],["Piatto unico","Piatto unico","",11,true]];
const daily=JSON.parse(localStorage.getItem("albertoDailyV2")||JSON.stringify(defaultDaily)).filter(x=>x[4]).map(x=>["Piatti del Giorno",x[1],x[2],Number(x[3])]);
const P=[...daily,...fixed],cats=[...new Set(P.map(x=>x[0]))];let cart=[];const euro=n=>"€ "+Number(n).toFixed(2).replace(".",",");
catsEl=document.getElementById("cats");catsEl.innerHTML=cats.map((c,i)=>`<button class="${i?"":"active"}" onclick="go(${i},this)">${c.toUpperCase()}</button>`).join("");function go(i,b){document.querySelectorAll(".cats button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("s"+i).scrollIntoView({behavior:"smooth"})}
function card(p,i,tag){return `<article class="card">${tag?'<span class="daytag">'+tag+'</span>':""}<h3>${p[1]}</h3><div class="desc">${p[2]}</div><div class="bottom"><span class="price">${euro(p[3])}</span><button class="add" onclick="add(${i})">+ AGGIUNGI</button></div></article>`}
menu.innerHTML=cats.map((c,ci)=>{
 if(c==="Piatti del Giorno"){
   const groups=[["PRIMI PIATTI",0,5],["SECONDI PIATTI",5,9],["CONTORNI",9,12],["PIATTO UNICO",12,13]];
   return `<section id="s${ci}"><h2>Piatti del Giorno</h2>`+groups.map(g=>`<h3 style="margin:28px 0 12px;font-size:22px">${g[0]}</h3><div class="grid">`+daily.slice(g[1],g[2]).map((p,j)=>card(p,g[1]+j,"")).join("")+`</div>`).join("")+`</section>`;
 }
 return `<section id="s${ci}"><h2>${c}</h2><div class="grid">`+P.map((p,i)=>p[0]===c?card(p,i,""):"").join("")+`</div></section>`;
}).join("");
const DEF=[{trigger:"Panini",title:"CI AGGIUNGI QUALCOSA? 🍟",text:"Vuoi un contorno di patatine fritte?",name:"Patatine fritte",price:3,active:true},{trigger:"ALL",title:"COSA VUOI BERE? 🥤",text:"Aggiungi una bevanda",name:"Bevanda",price:2.5,active:true},{trigger:"ALL",title:"UN DOLCE? 🍰",text:"Aggiungi il dolce del giorno",name:"Dolce del giorno",price:3,active:true}];let q=[],pos=0;function add(i){cart.push(P[i]);update();q=JSON.parse(localStorage.getItem("albertoUpsells")||JSON.stringify(DEF)).filter(x=>x.active&&(x.trigger==="ALL"||x.trigger===P[i][0]));pos=0;q.length?show():openCart()}function show(){let u=q[pos];if(!u){upsellModal.classList.remove("on");return openCart()}upsellStep.innerHTML=`<h2>${u.title}</h2><p>${u.text}</p><b>${u.name} · ${euro(u.price)}</b>`;upsellYes.textContent="+ AGGIUNGI · "+euro(u.price);upsellModal.classList.add("on")}upsellYes.onclick=()=>{let u=q[pos];cart.push(["Upselling",u.name,u.text,+u.price]);update();pos++;show()};upsellNo.onclick=()=>{pos++;show()};function update(){count.textContent=cart.length;total.textContent=euro(cart.reduce((s,p)=>s+p[3],0))}function openCart(){if(!cart.length)return;summary.innerHTML=cart.map(p=>"<p>"+p[1]+" <b>"+euro(p[3])+"</b></p>").join("");modal.classList.add("on")}function sendOrder(){if(!name.value||!phone.value)return alert("Inserisci nome e telefono");let os=JSON.parse(localStorage.getItem("albertoOrders")||"[]");os.unshift({id:Date.now(),name:name.value,phone:phone.value,time:pickup.value,notes:notes.value,items:cart,total:cart.reduce((s,p)=>s+p[3],0),status:"NUOVO"});localStorage.setItem("albertoOrders",JSON.stringify(os));alert("ORDINE CONFERMATO");cart=[];update();modal.classList.remove("on")}
</script></body></html>
