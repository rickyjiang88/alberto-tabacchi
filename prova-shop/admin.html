<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alberto · Pannello prova</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f4ef}header{background:#b5101b;color:white;padding:18px 5%}.tabs{display:flex;gap:8px;padding:15px 5%;background:white}.tabs button,.red{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.on,.red{background:#b5101b!important;color:white}main{padding:20px 5%}.panel{display:none}.panel.on{display:block}.card{background:white;border-radius:15px;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1.5fr .6fr .8fr;gap:8px}input,select{padding:10px;width:100%}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><h1>ALBERTO · PANNELLO</h1><small>AREA DI PROVA NON VISIBILE DAL MENU PUBBLICO</small></header><div class="tabs"><button class="on" onclick="tab('orders',this)">ORDINI</button><button onclick="tab('daily',this)">PIATTI DEL GIORNO</button><button onclick="tab('ups',this)">UPSELLING</button></div><main><section id="orders" class="panel on"><h2>Ordini</h2><div id="ol"></div></section><section id="daily" class="panel"><h2>Piatti del giorno</h2><div id="dl"></div><button class="red" onclick="daily.push(['Primi piatti','Nuovo piatto','',10,true]);drawD()">+ AGGIUNGI</button><button class="red" onclick="saveD()">SALVA</button></section><section id="ups" class="panel"><h2>Upselling</h2><div id="ul"></div><button class="red" onclick="ups.push({trigger:'Panini',title:'CI AGGIUNGI QUALCOSA?',text:'Vuoi aggiungere anche questo?',name:'Nuovo prodotto',price:3,active:true});drawU()">+ NUOVO</button><button class="red" onclick="saveU()">SALVA</button></section></main><script>
const DD=[["Primi piatti","Primo 1","",10,false],["Primi piatti","Primo 2","",10,false],["Primi piatti","Primo 3","",10,false],["Primi piatti","Primo 4","",10,false],["Primi piatti","Primo 5","",10,false],["Secondi piatti","Secondo 1","",10,false],["Secondi piatti","Secondo 2","",10,false],["Secondi piatti","Secondo 3","",10,false],["Secondi piatti","Secondo 4","",10,false],["Contorno","Contorno 1","",10,false],["Contorno","Contorno 2","",10,false],["Contorno","Contorno 3","",10,false]],DU=[{trigger:"Panini",title:"CI AGGIUNGI QUALCOSA? 🍟",text:"Vuoi un contorno di patatine fritte?",name:"Patatine fritte",price:3,active:true},{trigger:"ALL",title:"COSA VUOI BERE? 🥤",text:"Aggiungi una bevanda",name:"Bevanda",price:2.5,active:true},{trigger:"ALL",title:"UN DOLCE? 🍰",text:"Aggiungi il dolce del giorno",name:"Dolce del giorno",price:3,active:true}];let daily=JSON.parse(localStorage.getItem("albertoDaily")||JSON.stringify(DD)),ups=JSON.parse(localStorage.getItem("albertoUpsells")||JSON.stringify(DU));function tab(id,b){document.querySelectorAll(".panel,.tabs button").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");b.classList.add("on")}function drawD(){dl.innerHTML=daily.map((x,i)=>`<div class="card"><div class="row"><select onchange="daily[${i}][0]=this.value"><option>Primi piatti</option><option>Secondi piatti</option><option>Contorno</option><option>Piatto unico</option></select><input value="${x[1]}" onchange="daily[${i}][1]=this.value"><input type="number" value="${x[3]}" onchange="daily[${i}][3]=+this.value"><select onchange="daily[${i}][4]=this.value==='true'"><option value="true">Disponibile</option><option value="false">Esaurito</option></select></div><input value="${x[2]}" onchange="daily[${i}][2]=this.value"><button onclick="daily.splice(${i},1);drawD()">ELIMINA</button></div>`).join("")}function saveD(){localStorage.setItem("albertoDaily",JSON.stringify(daily));alert("Salvato")}function drawU(){ul.innerHTML=ups.map((u,i)=>`<div class="card"><div class="row"><select onchange="ups[${i}].trigger=this.value"><option>ALL</option><option>Panini</option><option>Insalatone</option><option>Piatti del Giorno</option></select><input value="${u.name}" onchange="ups[${i}].name=this.value"><input type="number" value="${u.price}" onchange="ups[${i}].price=+this.value"><select onchange="ups[${i}].active=this.value==='true'"><option value="true">Attivo</option><option value="false">Disattivo</option></select></div><input value="${u.title}" onchange="ups[${i}].title=this.value"><input value="${u.text}" onchange="ups[${i}].text=this.value"><button onclick="ups.splice(${i},1);drawU()">ELIMINA</button></div>`).join("")}function saveU(){localStorage.setItem("albertoUpsells",JSON.stringify(ups));alert("Salvato")}function orders(){let os=JSON.parse(localStorage.getItem("albertoOrders")||"[]");ol.innerHTML=os.length?os.map((o,i)=>`<div class="card"><b>${o.name} · ${o.time}</b><p>${o.items.map(x=>x[1]).join(" · ")}</p><b>€ ${o.total.toFixed(2)}</b><p>${o.status}</p><button onclick="st(${i},'ACCETTATO')">ACCETTA</button> <button onclick="st(${i},'IN PREPARAZIONE')">IN PREPARAZIONE</button> <button onclick="st(${i},'PRONTO')">PRONTO</button> <button onclick="st(${i},'CONSEGNATO')">CONSEGNATO</button></div>`).join(""):"Nessun ordine"}function st(i,s){let o=JSON.parse(localStorage.getItem("albertoOrders")||"[]");o[i].status=s;localStorage.setItem("albertoOrders",JSON.stringify(o));orders()}drawD();drawU();orders();
</script></body></html>
