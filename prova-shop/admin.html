<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alberto • Pannello prova</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f5f6;color:#17202a}header{background:#b50d18;color:white;padding:20px 5%;display:flex;justify-content:space-between}main{padding:28px 5%}.notice{background:#fff3cd;padding:12px;border-radius:10px;margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{padding:11px 15px;border:0;border-radius:12px;font-weight:800}.tabs button:first-child{background:#b50d18;color:#fff}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:15px;box-shadow:0 4px 18px #0000000c}.switch{border:0;border-radius:30px;padding:12px 18px;font-weight:800;background:#159447;color:#fff}.off{background:#ddd;color:#555}.price{font-weight:900;font-size:20px}@media(max-width:600px){.card{grid-template-columns:1fr}.switch{width:100%}}</style></head><body><header><div><b style="font-size:26px">ALBERTO</b><br><small>PANNELLO GESTIONE</small></div><b>MENU DEL GIORNO</b></header><main><div class="notice">VERSIONE DI PROVA • le modifiche qui non cambiano il sito pubblico.</div><div class="tabs"><button>Menu di oggi</button><button>Ordini</button><button>Prodotti</button></div><h1>Menu del giorno</h1><p>Attiva solo i piatti che vuoi mostrare oggi. Questa demo salva la scelta soltanto su questo dispositivo.</p><div id="list"></div></main><script>const ps=[['Riso alla cantonese','€ 8,00'],['Pollo alle mandorle','€ 10,00'],['Beata Burrata','€ 10,00'],['Insalatona','€ 9,00'],['Scaloppine al limone','€ 10,00']];let active=JSON.parse(localStorage.getItem('demoActive')||'[0,1,2]');function draw(){list.innerHTML=ps.map((p,i)=>'<div class="card"><div><b>'+p[0]+'</b><div class="price">'+p[1]+'</div></div><button class="switch '+(active.includes(i)?'':'off')+'" onclick="toggle('+i+')">'+(active.includes(i)?'● ATTIVO':'NON OGGI')+'</button></div>').join('')}function toggle(i){active=active.includes(i)?active.filter(x=>x!==i):[...active,i];localStorage.setItem('demoActive',JSON.stringify(active));draw()}draw()</script></body></html>
