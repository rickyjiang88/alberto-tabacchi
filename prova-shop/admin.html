<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alberto · Pannello prova</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f4ef}header{background:#b5101b;color:white;padding:18px 5%}.tabs{display:flex;gap:8px;padding:15px 5%;background:white}.tabs button,.red{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.on,.red{background:#b5101b!important;color:white}main{padding:20px 5%}.panel{display:none}.panel.on{display:block}.card{background:white;color:#181818;border-radius:15px;padding:16px;margin:12px 0}.card p,.card b{color:#181818}.card button{color:#181818}.fieldlabel{display:block;font-size:12px;font-weight:900;margin:10px 0 4px;color:#555}.photoBox{border:1px dashed #bbb;border-radius:10px;padding:12px;margin-top:8px}.photoPreview{width:100%;max-height:180px;object-fit:contain;display:block;margin:8px 0}.row{display:grid;grid-template-columns:1fr 1.5fr .6fr .8fr;gap:8px}input,select{padding:10px;width:100%}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div id="loginGate" style="position:fixed;inset:0;background:#f7f4ef;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:min(420px,100%)"><h2>ACCESSO PANNELLO</h2><input id="adminEmail" type="email" autocomplete="username" placeholder="Email"><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Password"><button class="red" id="loginBtn">ACCEDI</button><p id="loginError" style="color:#b5101b;font-weight:700"></p></div></div><header><h1>ALBERTO · PANNELLO</h1><small>AREA DI PROVA NON VISIBILE DAL MENU PUBBLICO</small></header><div class="tabs"><button class="on" onclick="tab('orders',this)">ORDINI</button><button onclick="tab('daily',this)">PIATTI DEL GIORNO</button><button onclick="tab('products',this)">PRODOTTI</button><button onclick="tab('ups',this)">UPSELLING</button></div><main><section id="orders" class="panel on"><h2>ORDINI ATTIVI</h2><div id="ol"></div><h2 style="margin-top:32px">ARCHIVIO · CONSEGNATI</h2><div id="archive"></div></section><section id="products" class="panel"><h2>PRODOTTI</h2><p>Modifica prodotto, descrizione, prezzo e foto.</p><div id="pl"></div><button class="red" onclick="saveProducts()">SALVA PRODOTTI</button></section><section id="daily" class="panel"><h2>Piatti del giorno</h2><div id="dl"></div><button class="red" onclick="daily.push(['Primi piatti','Nuovo piatto','',10,true]);drawD()">+ AGGIUNGI</button><button class="red" onclick="saveD()">SALVA</button></section><section id="ups" class="panel"><h2>Upselling</h2><div id="ul"></div><button class="red" onclick="ups.push({trigger:'Panini',title:'CI AGGIUNGI QUALCOSA?',text:'Vuoi aggiungere anche questo?',name:'Nuovo prodotto',price:3,active:true});drawU()">+ NUOVO</button><button class="red" onclick="saveU()">SALVA</button></section></main><script>
const DD=[["Primi piatti","Primo 1","",10,false],["Primi piatti","Primo 2","",10,false],["Primi piatti","Primo 3","",10,false],["Primi piatti","Primo 4","",10,false],["Primi piatti","Primo 5","",10,false],["Secondi piatti","Secondo 1","",10,false],["Secondi piatti","Secondo 2","",10,false],["Secondi piatti","Secondo 3","",10,false],["Secondi piatti","Secondo 4","",10,false],["Contorno","Contorno 1","",10,false],["Contorno","Contorno 2","",10,false],["Contorno","Contorno 3","",10,false],["Piatto unico","Piatto unico","",11,false]],DU=[{trigger:"Panini",title:"CI AGGIUNGI QUALCOSA? 🍟",text:"Vuoi un contorno di patatine fritte?",name:"Patatine fritte",price:3,active:true},{trigger:"ALL",title:"COSA VUOI BERE? 🥤",text:"Aggiungi una bevanda",name:"Bevanda",price:2.5,active:true},{trigger:"ALL",title:"UN DOLCE? 🍰",text:"Aggiungi il dolce del giorno",name:"Dolce del giorno",price:3,active:true}];let daily=JSON.parse(localStorage.getItem("albertoDaily")||JSON.stringify(DD)),ups=JSON.parse(localStorage.getItem("albertoUpsells")||JSON.stringify(DU));function tab(id,b){document.querySelectorAll(".panel,.tabs button").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");b.classList.add("on")}function drawD(){dl.innerHTML=daily.map((x,i)=>`<div class="card"><label class="fieldlabel">CATEGORIA</label><div class="row"><select onchange="daily[${i}][0]=this.value"><option ${x[0]==="Primi piatti"?"selected":""}>Primi piatti</option><option ${x[0]==="Secondi piatti"?"selected":""}>Secondi piatti</option><option ${x[0]==="Contorno"?"selected":""}>Contorno</option><option ${x[0]==="Piatto unico"?"selected":""}>Piatto unico</option></select><div><label class="fieldlabel">PRODOTTO</label><input value="${x[1]}" onchange="daily[${i}][1]=this.value"></div><div><label class="fieldlabel">PREZZO €</label><input type="number" step="0.01" value="${x[3]}" onchange="daily[${i}][3]=+this.value"></div><select onchange="daily[${i}][4]=this.value===\'true\'"><option value="true" ${x[4]!==false?"selected":""}>Disponibile</option><option value="false" ${x[4]===false?"selected":""}>Esaurito</option></select></div><label class="fieldlabel">DESCRIZIONE / INGREDIENTI / ALLERGENI</label><input value="${x[2]}" onchange="daily[${i}][2]=this.value"><button onclick="daily.splice(${i},1);drawD()">ELIMINA</button></div>`).join("")}async async function saveD(){localStorage.setItem("albertoDaily",JSON.stringify(daily));if(typeof window.saveDailyConfig==="function"){try{await window.saveDailyConfig(daily);localStorage.setItem("albertoDailyV2",JSON.stringify(daily));alert("Menu del giorno aggiornato nello shop.");return}catch(e){console.error(e);alert("Non riesco ancora a salvare su Firebase. Controlliamo le Regole.")}}else alert("Firebase è ancora in caricamento. Riprova tra un secondo.")}function drawU(){ul.innerHTML=ups.map((u,i)=>`<div class="card"><div class="row"><select onchange="ups[${i}].trigger=this.value"><option>ALL</option><option>Panini</option><option>Insalatone</option><option>Piatti del Giorno</option></select><input value="${u.name}" onchange="ups[${i}].name=this.value"><input type="number" value="${u.price}" onchange="ups[${i}].price=+this.value"><select onchange="ups[${i}].active=this.value==='true'"><option value="true">Attivo</option><option value="false">Disattivo</option></select></div><input value="${u.title}" onchange="ups[${i}].title=this.value"><input value="${u.text}" onchange="ups[${i}].text=this.value"><button onclick="ups.splice(${i},1);drawU()">ELIMINA</button></div>`).join("")}function saveU(){localStorage.setItem("albertoUpsells",JSON.stringify(ups));alert("Salvato")}drawD();drawU();const PRODUCT_DEFAULT=[["Piatti Freddi","Tacchino Leggero","Arrosto di tacchino con verdure lesse del giorno (1)",10],["Piatti Freddi","Crudo o Cotto?","con pomodorini, rucola, mozzarella (1-7)",10],["Piatti Freddi","Bufala e Verdure","alla griglia (1-7)",10],["Piatti Freddi","50 Gradi al Cuore (roast-beef)","Roastbeef homemade cotto a 50 gradi al cuore, accompagnato patate al forno o Pomodori, rucola e grana (1-7)",12],["Piatti Freddi","Regina Bresaola","con pomodorini, mozzarella di bufala (1-7)",12],["Insalatone","Classica","Insalata, pomodoro, carote, tonno e mais (4)",9],["Insalatone","Chicken","Insalata, pollo grigliato, crostini, scaglie di grana e salsa caesar (1-3-7-8)",9],["Insalatone","Greca","Insalata, pomodoro, feta, olive, cetrioli, cipolla e origano (7)",9],["Insalatone","Nizzarda","Insalata, patate, fagiolini*, uova soda, pomodorini e tonno",9],["Insalatone","Provenzale","Insalata, pomodoro, mozzarella, verdure grigliate, tonno (4-7)",9],["Panini","Il Classico","Prosciutto cotto, fontina (1-7)",6],["Panini","Crudo al Cuore","Prosciutto crudo, mozzarella (1-7)",6],["Panini","Ti Speck-o il Cuore","Speck, brie (1-7)",6],["Panini","Al Sud di Bologna","Mortadella, provola affumicata, pomodori secchi (1-7)",6],["Panini","Brie Sotto Rosa","Prosciutto cotto, brie, salsa rosa (1-3-7)",6],["Panini","Tacchino & Co","Arrosto di tacchino, insalata, pomodoro (1-7)",6],["Panini","Il Milanese","Cotoletta di pollo, pomodoro, insalata, maionese (1-3)",6],["Panini","La Finta Dieta","Verdure grigliate, mozzarella o brie (1-7)",6],["Panini","Cala-Brie","Salame piccante, brie, pomodori secchi (1-7)",6],["Panini","L’Eroe Salsiccia","Salsiccia, scamorza affumicata, peperoni (1-7)",7],["Piadine","Il Gemello","Prosciutto cotto, fontina (1-7)",7],["Piadine","Il Crudissimo","Prosciutto crudo, mozzarella (1-7)",7],["Piadine","La Valtellina","Bresaola, rucola, scaglie di grana (1-7)",8],["Toast","Prosciutto cotto, fontina","(1-7)",4.5]].map((x,i)=>({...{category:x[0],name:x[1],description:x[2],price:x[3]},photo:""}));let products=JSON.parse(localStorage.getItem("albertoProducts")||JSON.stringify(PRODUCT_DEFAULT));function drawProducts(){pl.innerHTML=products.map((p,i)=>`<div class="card"><b>${p.category}</b><label class="fieldlabel">PRODOTTO</label><input value="${p.name.replace(/"/g,"&quot;")}" onchange="products[${i}].name=this.value"><label class="fieldlabel">DESCRIZIONE</label><input value="${p.description.replace(/"/g,"&quot;")}" onchange="products[${i}].description=this.value"><label class="fieldlabel">PREZZO €</label><input type="number" step="0.01" value="${p.price}" onchange="products[${i}].price=+this.value"><div class="photoBox"><label class="fieldlabel">FOTO</label>${p.photo?`<img class="photoPreview" src="${p.photo}">`:"<small>Nessuna foto caricata</small>"}<input type="file" accept="image/*" onchange="setProductPhoto(${i},this)"><button onclick="products[${i}].photo='';drawProducts()">RIMUOVI FOTO</button></div></div>`).join("")}function setProductPhoto(i,input){const file=input.files&&input.files[0];if(!file)return;if(file.size>900000){alert("Foto troppo grande. Scegli una foto sotto 900 KB.");return}const r=new FileReader();r.onload=()=>{products[i].photo=r.result;drawProducts()};r.readAsDataURL(file)}function saveProducts(){try{localStorage.setItem("albertoProducts",JSON.stringify(products));alert("Prodotti salvati su questo dispositivo.")}catch(e){alert("Foto troppo pesanti per il salvataggio. Riduci le foto.")}}drawProducts();
</script><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyDSZzzgpqudJFgri4INDm1XQNs4ilR8-SU",authDomain:"alberto-tabacchi.firebaseapp.com",projectId:"alberto-tabacchi",storageBucket:"alberto-tabacchi.firebasestorage.app",messagingSenderId:"619128191346",appId:"1:619128191346:web:192da35141c3f5e30f85eb"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ADMIN_UID="vaQyMYFpkrNU0rsc6aGSnNTHmt43";
let unsub=null;
window.saveDailyConfig=async(rows)=>{const items=rows.map(x=>({category:x[0]||"",name:x[1]||"",description:x[2]||"",price:Number(x[3]||0),available:x[4]!==false}));await setDoc(doc(db,"settings","dailyMenu"),{items,updatedAt:serverTimestamp()});return items;};
async function loadDailyConfig(){try{const snap=await getDoc(doc(db,"settings","dailyMenu"));if(snap.exists()){daily=(snap.data().items||[]).map(x=>[x.category||"",x.name||"",x.description||"",Number(x.price||0),x.available!==false]);localStorage.setItem("albertoDaily",JSON.stringify(daily));drawD()}}catch(e){console.error("Menu del giorno:",e)}}
const gate=document.getElementById("loginGate"),err=document.getElementById("loginError");
document.getElementById("loginBtn").onclick=async()=>{err.textContent="";try{await signInWithEmailAndPassword(auth,document.getElementById("adminEmail").value.trim(),document.getElementById("adminPassword").value)}catch(e){err.textContent="Email o password non corretti."}};
onAuthStateChanged(auth,user=>{if(user&&user.uid===ADMIN_UID){gate.style.display="none";startOrders();loadDailyConfig()}else{gate.style.display="flex";if(user)signOut(auth)}});
function startOrders(){if(unsub)return;const q=query(collection(db,"orders"),orderBy("createdAt","desc"));unsub=onSnapshot(q,snap=>{const os=snap.docs.map(d=>({id:d.id,...d.data()}));const card=(o,archived=false)=>`<div class="card"><b>${o.orderNumber ? "#"+String(o.orderNumber).padStart(4,"0") : "#"+o.id.slice(-6).toUpperCase()} · ${o.name||""} · ${o.time||""}</b><p><b>Tel:</b> ${o.phone||""}</p><p>${(o.items||[]).map(x=>(x.name||x[1]||"")+((x.quantity||x[4]||1)>1?" ×"+(x.quantity||x[4]):"")).join(" · ")}</p>${o.notes?`<p><b>Note:</b> ${o.notes}</p>`:""}<b>€ ${Number(o.total||0).toFixed(2)}</b><p>${o.status||"NUOVO"}</p>${archived?"":`<button onclick="window.setOrderStatus(\'${o.id}\',\'IN PREPARAZIONE\')">IN PREPARAZIONE</button> <button onclick="window.setOrderStatus(\'${o.id}\',\'PRONTO\')">PRONTO</button> <button onclick="window.setOrderStatus(\'${o.id}\',\'CONSEGNATO\')">CONSEGNATO</button>`}</div>`;const active=os.filter(o=>o.status!=="CONSEGNATO"),done=os.filter(o=>o.status==="CONSEGNATO");ol.innerHTML=active.length?active.map(o=>card(o)).join(""):"Nessun ordine da preparare";document.getElementById("archive").innerHTML=done.length?done.map(o=>card(o,true)).join(""):"Nessun ordine consegnato"},e=>{console.error(e);ol.innerHTML="Errore nel caricamento ordini."})}
window.setOrderStatus=async(id,status)=>{await updateDoc(doc(db,"orders",id),{status})};
</script></body></html>
